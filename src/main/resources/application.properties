spring.application.name=backend-Mobimanten
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/mobimanten_db}
spring.data.mongodb.database=mobimanten_db
spring.graphql.graphiql.enabled=true
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
jwt.secret=${JWT_SECRET:default_jwt_secret_key_must_be_changed_in_prod_123456}
